<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨弈｜五子棋</title>
<style>
:root{color-scheme:light;--ink:#202b27;--soft:#4c5b51;--red:#943d2d;--line:#5a665744;--serif:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei",serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--serif);background:#eae6d9}
button,select{font:inherit;color:inherit}
.landscape{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.page{width:min(1150px,100%);margin:auto;padding:30px clamp(18px,5vw,56px) 25px}
.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2em}
.seal{display:grid;place-items:center;width:31px;height:31px;background:var(--red);color:#ffefe0;border:2px solid #e8c8ac;outline:1px solid var(--red);transform:rotate(-5deg);font-size:17px;letter-spacing:0}
.index,.kicker,.board-caption{font:700 11px/1.5 system-ui,sans-serif;letter-spacing:.22em;color:var(--soft)}
.layout{display:grid;grid-template-columns:minmax(235px,.64fr) minmax(0,1.36fr);align-items:center;gap:clamp(26px,5vw,75px);padding-top:clamp(24px,5vh,47px)}
.kicker{color:var(--red);margin:0 0 9px}
h1{margin:0;line-height:1.02;font-size:clamp(4rem,8vw,7.1rem);font-weight:800;letter-spacing:.04em;text-shadow:0 1px #fff9}
.intro{color:var(--soft);margin:15px 0 22px;font-size:1rem}
.card{max-width:320px;border:1px solid var(--line);border-top:2px solid #5b6559;background:#f7f2e8ee;padding:14px 15px 15px;box-shadow:0 7px 24px #3f443015}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px;margin-bottom:9px;border-bottom:1px solid var(--line);font:700 .76rem/1.4 system-ui,sans-serif}
.settings label{display:grid;gap:4px}
.settings select{width:100%;min-width:0;padding:6px 4px;border:1px solid #53645666;background:#fbf7ee;border-radius:0}
.settings select:disabled{opacity:.55}
.turn{display:flex;gap:12px;align-items:center;min-height:48px}
.token{position:relative;width:30px;height:30px;flex:none}
#status{font-size:1.23rem;font-weight:700;line-height:1.35;margin:0}
#detail{font:13px/1.4 system-ui,sans-serif;color:var(--soft);margin:3px 0 0}
.actions{display:flex;gap:8px;margin-top:11px}
.actions button{padding:7px 12px;flex:1;border:1px solid #53645666;background:#fbf7ee;cursor:pointer;font:700 .84rem/1.5 system-ui,sans-serif}
.actions button:first-child{background:#39483c;color:#fff9ec}
.actions button:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--red)}
.actions button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:3px}
figure{margin:0;width:min(100%,min(66vh,630px));justify-self:center}
.board{--inset:5.65%;position:relative;aspect-ratio:1;background:
radial-gradient(ellipse at 24% 13%,#fff5c95e,transparent 65%),
repeating-linear-gradient(7deg,#61351912 0 1px,transparent 1px 5px,#ffdf9836 6px 7px,transparent 8px 13px),
repeating-linear-gradient(2deg,#a367282e 0 3px,transparent 3px 19px,#7c461921 20px 22px,transparent 23px 40px),
linear-gradient(125deg,#e7bd7c,#d29a56 62%,#e4ad64);
border:1px solid #85582f;border-radius:5px;box-shadow:inset 0 0 0 3px #ffe0a268,inset 0 0 25px #8c4c3248,0 8px 0 #94623b,0 10px 0 #62432e,0 21px 35px -10px #37261a80}
.board-art{position:absolute;inset:var(--inset);width:calc(100% - 2 * var(--inset));height:calc(100% - 2 * var(--inset));overflow:visible;pointer-events:none}
.points{position:absolute;inset:calc(var(--inset) - (100% - 2 * var(--inset)) / 28);display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr)}
.point{border:0;background:none;position:relative;padding:0;min-width:0;min-height:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.point:focus-visible{outline-offset:-1px;border-radius:4px;z-index:1}
.point[data-stone],.points[data-locked] .point{cursor:default}
.stone,.point[data-stone]::before,.points:not([data-locked]) .point:not([data-stone]):focus-visible::before{display:block;border-radius:50%;position:absolute}
.stone{inset:0}
.point[data-stone]::before,.points:not([data-locked]) .point:not([data-stone]):focus-visible::before{content:"";inset:5%}
.stone.black,.point[data-stone="black"]::before{background:radial-gradient(circle at 32% 25%,#67706a 0,#343c36 21%,#171d1a 57%,#060908 87%);box-shadow:inset 0 1px 1px #b0b8af42,0 2px 3px #422812a0}
.stone.white,.point[data-stone="white"]::before{background:radial-gradient(circle at 33% 25%,#fffef8 0,#faf4e7 30%,#e7ddc7 65%,#a29a85 100%);box-shadow:inset 0 1px 1px #fff9,0 2px 3px #42281280}
.points:not([data-locked]) .point:not([data-stone]):focus-visible::before{background:#27312d5e}
.points[data-next="white"]:not([data-locked]) .point:not([data-stone]):focus-visible::before{background:#fff9eabf}
@media(hover:hover){
  .points:not([data-locked]) .point:not([data-stone]):hover::before{content:"";position:absolute;inset:8%;border-radius:50%;background:#27312d5e}
  .points[data-next="white"]:not([data-locked]) .point:not([data-stone]):hover::before{background:#fff9eabf}
}
.point.last::after,.point.win::after{content:"";position:absolute;inset:38%;border:1px solid #ffce99;border-radius:50%;background:#a13e2b}
.point.win::after{inset:11%;border:2px solid #e58a56;background:none}
.board-caption{display:flex;justify-content:space-between;gap:8px;margin-top:22px}
@media(max-width:740px){
  .page{padding-top:18px}.layout{grid-template-columns:1fr;gap:17px;padding-top:17px}
  h1{font-size:clamp(3rem,11vw,4.3rem)}.kicker{margin-bottom:3px}.intro{font-size:.9rem;margin:5px 0 11px}
  .card{max-width:none;padding:8px 10px}.settings{padding-bottom:8px;margin-bottom:6px}
  .game-controls{display:flex;align-items:center;justify-content:space-between;gap:7px}
  .turn{gap:7px;min-height:37px}.token{width:23px;height:23px}#status{font-size:1rem}#detail{font-size:11px}
  .actions{margin:0}.actions button{padding:6px 8px;white-space:nowrap}figure{width:min(100%,510px)}
}
@media(max-width:350px){.page{padding-inline:12px}.index,.board-caption{letter-spacing:.08em}.actions{gap:4px}}
</style>
</head>
<body>
<svg class="landscape" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f8f3e7"/><stop offset="1" stop-color="#deded0"/></linearGradient>
<linearGradient id="wash" x2="0" y2="1"><stop stop-color="#4b655b" stop-opacity=".45"/><stop offset="1" stop-color="#718b7c" stop-opacity="0"/></linearGradient>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/></filter>
<filter id="feather"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<path d="M0 0H1440V900H0Z" fill="url(#paper)"/>
<circle cx="1197" cy="199" r="91" fill="#b45b45" opacity=".13"/>
<g fill="url(#wash)" filter="url(#feather)">
<path d="M-30 641 37 565 90 536 147 471 190 459 216 485 247 489 294 548 323 557 367 612 416 634 458 677 552 730V860H-30Z"/>
<path d="m744 748 121-88 55-10 56-63 47-23 45-74 35-15 33 21 37 47 49 21 62-89 39-36 24 6 36 39 32 19 55 70 53 34v234H744Z"/>
<path d="M-35 799 42 733 78 687 111 671 143 693 175 683 223 731 257 748 290 786 343 809 432 900H-35Z"/>
<path d="m962 900 73-72 71-17 74-68 35-5 45-48 34 6 38 45 38-13 80 47v125Z"/>
</g>
<g fill="none" stroke="#50695f" stroke-opacity=".25" stroke-linecap="round">
<path d="M-10 805Q174 766 363 816M-14 837Q207 797 469 855M-14 860Q149 836 309 857M918 850q189-35 433-11M1077 875q172-27 365-1"/>
<path d="M1110 257q10-7 20 0 7-9 19-7m27-22q8-5 15 1 5-7 13-5m-96 74q6-4 12 0 4-6 11-5" stroke-width="2"/>
</g>
<path d="M0 0H1440V900H0Z" filter="url(#grain)" opacity=".105" style="mix-blend-mode:multiply"/>
</svg>
<main class="page">
<header class="mast"><div class="brand"><span class="seal" aria-hidden="true">弈</span> 山房棋譜</div><span class="index">GOMOKU / 15 × 15</span></header>
<div class="layout">
<section aria-labelledby="title">
<p class="kicker" id="kicker">人機對弈</p>
<h1 id="title">墨弈</h1>
<p class="intro">黑棋先行，率先連成五子者勝。</p>
<div class="card">
  <div class="settings">
    <label>對手<select id="mode" aria-describedby="mode-help"><option value="ai">AI 對手</option><option value="local">雙人對弈</option></select></label>
    <label>難度<select id="level">
      <option value="1">1 · 入門</option><option value="2">2 · 初級</option>
      <option value="3" selected>3 · 中級</option><option value="4">4 · 高級</option><option value="5">5 · 大師</option>
    </select></label>
  </div>
  <div class="game-controls">
    <div class="turn">
      <span class="token" aria-hidden="true"><span id="token" class="stone black"></span></span>
      <div aria-live="polite" aria-atomic="true"><p id="status">輪到你</p><p id="detail">你執黑 · 第 1 手</p></div>
    </div>
    <div class="actions"><button type="button" id="undo" disabled>悔棋</button><button type="button" id="reset" disabled>重開</button></div>
  </div>
  <span id="mode-help" hidden>切換對手會開啟新棋局。</span>
</div>
</section>
<figure>
<div class="board">
  <svg class="board-art" viewBox="0 0 420 420" aria-hidden="true">
    <path id="lines" fill="none" stroke="#674427" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <g id="stars" fill="#543821"></g>
  </svg>
  <div class="points" id="points" role="group" aria-label="十五乘十五五子棋棋盤" aria-describedby="instructions" data-next="black"></div>
</div>
<figcaption class="board-caption" id="instructions"><span>點選交叉點落子</span><span>方向鍵移動 · Enter 落子</span></figcaption>
</figure>
</div>
</main>
<script>
'use strict';
const size = 15;
const center = Math.floor(size/2);
const game = Array.from({length:size}, () => Array(size).fill(null));
const history = [], cells = [];
const get = id => document.getElementById(id);
const points = get('points'), status = get('status'), detail = get('detail');
const token = get('token'), undo = get('undo'), reset = get('reset');
const mode = get('mode'), level = get('level');
const names = {black:'黑棋',white:'白棋'};
const directions = [[0,1],[1,0],[1,1],[1,-1]];
const other = color => color === 'black' ? 'white' : 'black';
const aiMode = () => mode.value === 'ai';
const ended = () => winning.length > 0 || drawn;
const aiTurn = () => aiMode() && next === 'white' && !ended();
let activeIndex = center*size+center, next = 'black', winning = [], drawn = false;
let aiTimer;
const coordinates = Array.from({length:size}, (_,i) => 30*i);
get('lines').setAttribute('d', coordinates.map(n => 'M0 '+n+'H420 M'+n+' 0V420').join(' '));
for(const y of [90,210,330]){
  for(const x of [90,210,330]){
    const star = document.createElementNS('http://www.w3.org/2000/svg','circle');
    star.setAttribute('cx',x); star.setAttribute('cy',y); star.setAttribute('r',2.8);
    get('stars').append(star);
  }
}
function setActive(index, focus){
  cells[activeIndex].tabIndex = -1;
  activeIndex = index;
  cells[activeIndex].tabIndex = 0;
  if(focus) cells[activeIndex].focus({preventScroll:true});
}
function setStone(row,col,color){
  game[row][col] = color;
  const cell = cells[row*size+col];
  if(color) cell.dataset.stone = color;
  else delete cell.dataset.stone;
  cell.setAttribute('aria-label','第 '+(row+1)+' 橫列，第 '+(col+1)+' 直行，'+(names[color] || '空位'));
}
function findWin(row,col,color){
  for(const [dy,dx] of directions){
    const line = [[row,col]];
    for(const sign of [-1,1]){
      let y = row+sign*dy, x = col+sign*dx;
      while(game[y]?.[x] === color){
        line.push([y,x]);
        y += sign*dy; x += sign*dx;
      }
    }
    if(line.length >= 5) return line;
  }
  return [];
}
function update(){
  const last = history.at(-1);
  points.toggleAttribute('data-locked', ended() || aiTurn());
  points.dataset.next = next;
  token.className = 'stone ' + (winning.length ? last.color : next);
  if(winning.length){
    status.textContent = aiMode() ? (last.color === 'black' ? '你贏了' : 'AI 獲勝') : names[last.color]+'獲勝';
    detail.textContent = names[last.color]+'已連成五子';
  } else if(drawn){
    status.textContent = '和局';
    detail.textContent = '棋盤已下滿';
  } else {
    status.textContent = aiMode() ? (aiTurn() ? 'AI 思考中…' : '輪到你') : names[next]+'落子';
    const side = aiMode() ? (aiTurn() ? 'AI 執白 · ' : '你執黑 · ') : '';
    detail.textContent = side+'第 '+(history.length+1)+' 手';
  }
  undo.disabled = reset.disabled = history.length === 0;
  level.disabled = !aiMode();
  get('kicker').textContent = aiMode() ? '人機對弈' : '雙人對弈';
  for(const cell of points.querySelectorAll('.last,.win')) cell.classList.remove('last','win');
  if(last) cells[last.row*size+last.col].classList.add('last');
  for(const [row,col] of winning) cells[row*size+col].classList.add('win');
}
function play(row,col){
  if(ended() || game[row][col]) return;
  setStone(row,col,next);
  history.push({row,col,color:next});
  winning = findWin(row,col,next);
  drawn = !winning.length && history.length === size*size;
  next = other(next);
  update();
  if(aiTurn()){
    aiTimer = setTimeout(() => {
      if(!aiTurn()) return;
      const move = chooseAiMove(Number(level.value));
      if(move) play(move.row,move.col);
    },240);
  }
}
const winScore = 1000000;
const patternScores = [0,1,7,55,650];
function moveValue(row,col,color){
  let total = 0;
  for(const [dy,dx] of directions){
    // Five-cell windows capture threats with a gap as well as unbroken lines.
    const line = [];
    for(let offset=-4;offset<=4;offset++){
      line.push(offset === 0 ? color : game[row+offset*dy]?.[col+offset*dx]);
    }
    let strongest = 0;
    const completions = new Set();
    for(let start=0;start<=4;start++){
      let count = 0, gap = -1, usable = true;
      for(let i=start;i<start+5;i++){
        if(line[i] === color) count++;
        else if(line[i] === null) gap = i;
        else { usable = false; break; }
      }
      if(!usable) continue;
      if(count === 5) return winScore;
      if(count === 4) completions.add(gap);
      strongest = Math.max(strongest,patternScores[count]);
    }
    let left = 3, right = 5;
    while(line[left] === color) left--;
    while(line[right] === color) right++;
    if(right-left === 4 && line[left] === null && line[right] === null) strongest = 170;
    if(completions.size >= 2) strongest = 12000;
    total += strongest;
  }
  return total;
}
function nearbyMoves(){
  const marked = new Set();
  for(let row=0;row<size;row++){
    for(let col=0;col<size;col++){
      if(!game[row][col]) continue;
      for(let y=Math.max(0,row-2);y<=Math.min(size-1,row+2);y++){
        for(let x=Math.max(0,col-2);x<=Math.min(size-1,col+2);x++){
          if(game[y][x] === null) marked.add(y*size+x);
        }
      }
    }
  }
  if(!marked.size && game[center][center] === null) marked.add(center*size+center);
  return Array.from(marked,index => ({row:Math.floor(index/size),col:index%size}));
}
function rankMoves(color,defense){
  const opponent = other(color);
  return nearbyMoves().map(move => {
    const {row,col} = move;
    const attack = moveValue(row,col,color), block = moveValue(row,col,opponent);
    const distance = Math.abs(row-center)+Math.abs(col-center);
    const score = attack + defense*block + (2*center-distance)*.11;
    return {...move,attack,block,score};
  }).sort((a,b) => b.score-a.score);
}
function forcingMoves(moves){
  const win = moves.find(move => move.attack === winScore);
  if(win) return [win];
  const blocks = moves.filter(move => move.block === winScore);
  return blocks.length ? blocks : moves;
}
function search(color,depth,width,alpha,beta,deadline){
  if(performance.now() >= deadline) return null;
  const ranked = rankMoves(color,1);
  if(!ranked.length) return 0;
  if(ranked.some(move => move.attack === winScore)) return winScore+depth;
  if(ranked.filter(move => move.block === winScore).length > 1) return -winScore-depth;
  if(depth === 0){
    const attack = Math.max(...ranked.map(move => move.attack));
    const threat = Math.max(...ranked.map(move => move.block));
    return attack-threat*.8;
  }
  let best = -Infinity;
  for(const move of forcingMoves(ranked).slice(0,width)){
    game[move.row][move.col] = color;
    const reply = search(other(color),depth-1,width,-beta,-alpha,deadline);
    game[move.row][move.col] = null;
    if(reply === null) return null;
    best = Math.max(best,-reply);
    alpha = Math.max(alpha,best);
    if(alpha >= beta) break;
  }
  return best;
}
function chooseAiMove(difficulty){
  const ranked = rankMoves('white',difficulty <= 2 ? .45 : 1);
  if(!ranked.length) return;
  if(difficulty === 1) return ranked[Math.floor(Math.random()*Math.min(14,ranked.length))];
  const win = ranked.find(move => move.attack === winScore);
  if(win) return win;
  if(difficulty === 2) return ranked[Math.floor(Math.random()*Math.min(3,ranked.length))];
  const candidates = forcingMoves(ranked).slice(0,7);
  let choice = candidates[0];
  if(difficulty === 3 || candidates.length < 2) return choice;
  const deadline = performance.now() + (difficulty === 4 ? 130 : 280);
  // Keep the best move from the last complete search if time runs out.
  for(let depth=1;depth<=difficulty-3;depth++){
    let best = -Infinity, bestMove = choice;
    for(const move of candidates){
      game[move.row][move.col] = 'white';
      const reply = search('black',depth,4,-Infinity,-best,deadline);
      game[move.row][move.col] = null;
      if(reply === null) return choice;
      if(-reply > best){ best = -reply; bestMove = move; }
    }
    choice = bestMove;
  }
  return choice;
}
for(let row=0;row<size;row++){
  for(let col=0;col<size;col++){
    const index = row*size+col;
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'point';
    cell.tabIndex = index === activeIndex ? 0 : -1;
    cells.push(cell);
    setStone(row,col,null);
    cell.addEventListener('focus', () => setActive(index,false));
    cell.addEventListener('click', () => {
      setActive(index,false);
      if(!aiTurn()) play(row,col);
    });
    points.append(cell);
  }
}
points.addEventListener('keydown',event => {
  const arrows = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  const move = arrows[event.key];
  if(!move) return;
  event.preventDefault();
  const row = Math.min(size-1,Math.max(0,Math.floor(activeIndex/size)+move[0]));
  const col = Math.min(size-1,Math.max(0,activeIndex%size+move[1]));
  setActive(row*size+col,true);
});
undo.addEventListener('click',() => {
  if(!history.length) return;
  clearTimeout(aiTimer);
  if(aiMode() && history.at(-1).color === 'white'){
    const reply = history.pop();
    setStone(reply.row,reply.col,null);
  }
  const last = history.pop();
  setStone(last.row,last.col,null);
  next = last.color; winning = []; drawn = false;
  setActive(last.row*size+last.col,false);
  update();
});
function restart(){
  clearTimeout(aiTimer);
  for(const {row,col} of history) setStone(row,col,null);
  history.length = 0;
  next = 'black'; winning = []; drawn = false;
  setActive(center*size+center,false);
  update();
}
reset.addEventListener('click',restart);
mode.addEventListener('change',restart);
update();
</script>
</body>
</html>
